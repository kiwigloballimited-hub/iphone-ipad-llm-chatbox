name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalAIChat.xcodeproj \
            -scheme LocalAIChat \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Check translations (English, Traditional Chinese)
        run: |
          xcodebuild -exportLocalizations \
            -project LocalAIChat.xcodeproj \
            -localizationPath build/loc \
            -exportLanguage en \
            -exportLanguage zh-Hant \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO > export.log 2>&1 || { tail -40 export.log; exit 1; }
          python3 .github/scripts/loc_report.py build/loc
